<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>Student Mangement System</h1>
        <p>Manage student records efficiently</p>
    </header>
    <main>
        <!--Dashboard Statistics-->
        <section id="dashboards">
            <h2>Dashboards</h2>

            <div class="cards">

                <div class="card">
                    <h3>Total Students</h3>
                    <p>0</p>
                </div>

                <div class="card">
                    <h3>Highest Average</h3>
                    <p>0%</p>
                </div>

                <div class="card">
                    <h3>Lowest Average</h3>
                    <p>0%</p>
                </div>
                <div class="card">
                    <h3>Class Average</h3>
                    <p>0%</p>
                </div>

            </div>

        </section>

        <!--Student Form-->
        <section id="student-form">
            <h2>Add Student</h2>
            <form>
                <label for="studentNumber">Student Number:</label>
                <input type="text" id="studentNumber">
                
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName">

                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName">

                <label for="course">Course</label>
                <input type="text" id="course">

                <label for="age">Age:</label>
                <input type="number" id="age">

                <label for="average">Average:</label>
                <input type="number" id="average">

                <button type="submit">Add Student</button>

            </form>

        </section>

        <!--Student Table-->
        <section id="student-table">
            <h2>Student Life</h2>
            <table>
                <thead>
                    <tr>
                        <th>Student No.</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Course</th>
                        <th>Age</th>
                        <th>Average</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!--Student appear when we use javascript-->
                </tbody>
            </table>

        </section>

    </main>
    <!--JavaScript-->
        <script type="module" src="js/app.js"></script>
    
</body>
</html>
